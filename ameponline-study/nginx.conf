upstream amep_online {
	server ameponline.homeaffairs.gov.au:443;
	keepalive 16;
}

server {
	listen 8080;
	server_name _;
	access_log off;

	location / {
		proxy_pass https://amep_online;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host ameponline.homeaffairs.gov.au;
		proxy_set_header User-Agent $http_user_agent;
		proxy_set_header X-Forwarded-For "";
		proxy_set_header X-Real-IP "";
		proxy_set_header Forwarded "";
		proxy_set_header Accept-Encoding "";
		proxy_ssl_server_name on;
		proxy_ssl_name ameponline.homeaffairs.gov.au;
		proxy_ssl_verify on;
		proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
		proxy_ssl_verify_depth 3;
		proxy_redirect https://ameponline.homeaffairs.gov.au/ https://LWA.spiritwave.dpdns.org/;
		proxy_redirect http://ameponline.homeaffairs.gov.au/ https://LWA.spiritwave.dpdns.org/;
		proxy_cookie_domain ameponline.homeaffairs.gov.au LWA.spiritwave.dpdns.org;
		proxy_cookie_domain .homeaffairs.gov.au LWA.spiritwave.dpdns.org;
		proxy_buffering off;
		proxy_max_temp_file_size 0;
		sub_filter_once off;
		sub_filter_types text/css application/javascript application/json;
		sub_filter ameponline.homeaffairs.gov.au LWA.spiritwave.dpdns.org;
		sub_filter https://ameponline.homeaffairs.gov.au https://LWA.spiritwave.dpdns.org;
		sub_filter http://ameponline.homeaffairs.gov.au https://LWA.spiritwave.dpdns.org;
		sub_filter //ameponline.homeaffairs.gov.au //LWA.spiritwave.dpdns.org;
	}
}
